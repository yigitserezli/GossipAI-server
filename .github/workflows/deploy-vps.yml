name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write runtime .env
        shell: bash
        run: |
          cat <<'EOF' > .env
          ${{ secrets.VPS_ENV_FILE }}
          EOF

      - name: Write Google OAuth credentials
        shell: bash
        env:
          GOOGLE_OAUTH_CREDENTIALS_JSON: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$GOOGLE_OAUTH_CREDENTIALS_JSON" > .secrets/google-oauth.json

      - name: Fix deploy path permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo chown -R deploy:deploy ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Upload project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: ".env,.secrets,docker-compose.yml,nginx,certbot,GossipAI-backend,GossipAI-web"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Build and restart services on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            # Start only Postgres first. Starting the backend before migrations
            # are applied risks app startup against a partially updated schema.
            docker compose build backend web
            docker compose up -d postgres

            # Apply the legacy migration-history recovery and all pending
            # migrations in a one-off backend container before the app starts.
            docker compose run --rm --no-deps --entrypoint sh backend -c '
              npx prisma migrate resolve --applied 00000000000000_baseline || true
              npx prisma migrate resolve --applied 20260505000000_add_premium_expires_at || true
              npx prisma migrate resolve --rolled-back 20260719000000_add_external_deletion_tasks || true
              # The previous release used db push before migrate deploy, which
              # may have created Google OAuth tables before this migration ran.
              npx prisma migrate resolve --rolled-back 20260727000000_add_google_oauth || true
              npx prisma migrate deploy
            '

            docker compose up -d --remove-orphans
            docker compose ps
